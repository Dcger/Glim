plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'dev.discovery.wallpaper'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.discovery.wallpaper'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.2.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
